spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cactech_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080

jwt:
  secret: cactech-super-secret-key-for-jwt-token-signature-2026
  expiration: 86400000

app:
  upload:
    avatar-dir: uploads/avatars
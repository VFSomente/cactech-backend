spring:
  # Configurações locais (credenciais de e-mail etc.) ficam em application-local.yml,
  # na pasta do backend. Esse arquivo é opcional e está no .gitignore.
  config:
    import: "optional:file:./application-local.yml"
  datasource:
    url: jdbc:postgresql://localhost:5432/cactech_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080

jwt:
  secret: cactech-super-secret-key-for-jwt-token-signature-2026
  expiration: 86400000

app:
  upload:
    avatar-dir: uploads/avatars
  # Endereço do site, usado nos links enviados por e-mail
  frontend-url: http://localhost:4300
  redefinicao-senha:
    validade-minutos: 30
  mail:
    from: "CacTech <nao-responda@cactech.com.br>"

# E-mail (SMTP): sem configuração, os links de redefinição de senha aparecem no log.
# Para enviar de verdade, copie application-local.example.yml para application-local.yml
# (na pasta do backend) e preencha as credenciais.
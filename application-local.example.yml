# Copie este arquivo para "application-local.yml" (mesma pasta) e preencha.
# application-local.yml está no .gitignore: suas credenciais não vão para o Git.
#
# Gmail: use uma "senha de app", não a senha normal da conta.
#   1. Ative a verificação em duas etapas: https://myaccount.google.com/security
#   2. Crie a senha de app em: https://myaccount.google.com/apppasswords
#   3. Cole os 16 caracteres (sem espaços) em "password" abaixo.

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: seu-email@gmail.com
    password: cole-aqui-a-senha-de-app
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: "CacTech <seu-email@gmail.com>"
